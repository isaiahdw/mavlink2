name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.18"
            otp: "27"
          - elixir: "1.20"
            otp: "29"
            lint: true
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      # _build also holds the Dialyzer PLTs (_build/plts).
      - name: Cache deps and build
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: mix-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}
          restore-keys: mix-${{ matrix.elixir }}-${{ matrix.otp }}-

      - run: mix deps.get

      - run: mix compile --warnings-as-errors

      - if: matrix.lint
        run: mix format --check-formatted

      - if: matrix.lint
        run: mix docs --warnings-as-errors
        env:
          MIX_ENV: dev

      - run: mix test

      # Building the PLT recompiles OTP's xmerl_ucs with the options it was
      # built with, which prints its missing-spec compiler warnings; this
      # project has no Erlang sources, so the Erlang warning matcher only
      # turns those into annotations. Dialyzer's own findings are annotated
      # by --format github.
      - if: matrix.lint
        run: echo "::remove-matcher owner=erlc-warning::"

      # The test environment also compiles test/support, so this checks a
      # dialect generated from common.xml as well as the library.
      - if: matrix.lint
        run: mix dialyzer --format github
